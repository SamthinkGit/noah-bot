[project]
name = "noah-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SamthinkGit", email = "sebastianmayorquin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "discord-py[voice]==2.7.0",
    "discord[voice]>=2.3.2",
    "dotenv>=0.9.9",
    "elevenlabs>=2.38.1",
    "langchain>=1.2.3",
    "langchain-openai>=1.1.7",
    "langchain-xai>=1.2.2",
    "librespot",
    "pillow>=12.1.0",
    "pynacl>=1.5,<1.6",
    "requests>=2.32.0",
    "rich>=14.2.0",
    "tinydb>=4.8.2",
]

[project.scripts]
noah-bot = "noah_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "memory-profiler>=0.61.0",
    "rich>=14.2.0",
]

[tool.uv.sources]
librespot = { git = "https://github.com/kokarare1212/librespot-python.git" }
